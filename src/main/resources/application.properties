spring.application.name=carecircle-ai
server.port=${PORT:8086}

# Database Configuration (MySQL as primary, supports DB_URL environment variable)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/carecircle_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Security Configuration
jwt.secret=${JWT_SECRET:CareCircleAISecretKeyForJWTHackathon2026SecureKeyWithAtLeast256BitsLong!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google Gemini API
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}

# Email Alert Configuration (JavaMailSender)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Scheduler Configuration (intervals in milliseconds)
carecircle.scheduler.reminder-check-rate=60000
carecircle.scheduler.caregap-analysis-rate=300000

# CORS Configuration
carecircle.cors.allowed-origins=*
